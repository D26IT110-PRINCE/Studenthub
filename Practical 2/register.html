<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Metadata about the page -->
  <meta charset="UTF-8"> <!-- Ensures proper character encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes page responsive -->
  <title>StudentHub - Register</title> <!-- Title shown in browser tab -->
</head>
<body>
  <!-- Header section with site title and navigation -->
  <header>
    <h1>StudentHub Portal</h1> <!-- Main heading of the site -->

    <!-- Navigation menu with links to other pages -->
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="register.html">Register</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main content area -->
  <main>
    <!-- Section for registration form -->
    <section aria-labelledby="register-title">
      <h2 id="register-title">Student Registration</h2>
      
      <!-- Skeleton form structure (no validation or styling yet) -->
      <form action="#" method="post">
        <!-- Name field -->
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" aria-required="true">

        <!-- Email field -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" aria-required="true">

        <!-- Password field -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" aria-required="true">

        <!-- Confirm Password field -->
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" aria-required="true">

        <!-- Course selection -->
        <label for="course">Course:</label>
        <select id="course" name="course">
          <option value="">--Select Course--</option>
          <option value="btech">B.Tech</option>
          <option value="mca">MCA</option>
          <option value="msc">M.Sc</option>
        </select>

        <!-- Year selection -->
        <label for="year">Year:</label>
        <select id="year" name="year">
          <option value="">--Select Year--</option>
          <option value="1">1st Year</option>
          <option value="2">2nd Year</option>
          <option value="3">3rd Year</option>
          <option value="4">4th Year</option>
        </select>

        <!-- Gender selection -->
        <fieldset>
          <legend>Gender:</legend>
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
          <label><input type="radio" name="gender" value="other"> Other</label>
        </fieldset>

        <!-- Terms acceptance -->
        <label>
          <input type="checkbox" name="terms" aria-required="true"> I accept the terms and conditions
        </label>

        <!-- Submit button -->
        <button type="submit">Register</button>
      </form>
    </section>
  </main>

  <!-- Footer section -->
  <footer>
    <p>&copy; 2026 StudentHub Portal</p>
  </footer>
</body>
</html>
