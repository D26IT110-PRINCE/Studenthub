<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AJAX CRUD Demo | StudentHub Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .crud-container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .form-card { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-bottom: 2rem; }
    .status-msg { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
    .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .crud-table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: #fff; }
    .crud-table th, .crud-table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    .crud-table th { background: #f8f9fa; font-weight: 600; }
    .btn-action { border: none; background: none; cursor: pointer; font-weight: bold; margin-right: 10px; }
    .btn-edit { color: #007bff; }
    .btn-delete { color: #dc3545; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <a class="brand" href="index.html">
        <img src="assets/studenthub-logo.png" alt="Logo" width="56" height="56">
        <h1>StudentHub Admin</h1>
      </a>
      <button class="theme-toggle" type="button">Change Theme</button>
    </div>
    <nav id="site-nav" class="site-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="admin_dashboard.php">Dashboard</a></li>
        <li><a href="logout.php">Logout</a></li>
      </ul>
    </nav>
  </header>

  <div class="loading-overlay" id="loader">
    <div class="spinner"></div>
  </div>

  <main class="crud-container">
    <h2>AJAX-Based Event Management</h2>
    <p>Practical 13: Asynchronous CRUD using Fetch API and PHP JSON endpoints.</p>

    <div id="status" class="status-msg"></div>

    <section class="form-card">
      <h3 id="form-title">Add New Event</h3>
      <form id="event-form">
        <input type="hidden" id="event-id">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
          <div>
            <label>Title *</label>
            <input type="text" id="title" required>
          </div>
          <div>
            <label>Date *</label>
            <input type="date" id="date" required>
          </div>
          <div>
            <label>Location *</label>
            <input type="text" id="location" required>
          </div>
          <div>
            <label>Category *</label>
            <select id="category" required>
              <option value="">Select category</option>
              <option value="Technical">Technical</option>
              <option value="Cultural">Cultural</option>
              <option value="Sports">Sports</option>
              <option value="Academic">Academic</option>
            </select>
          </div>
        </div>
        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary" id="submit-btn">Add Event</button>
          <button type="button" class="btn btn-secondary" id="cancel-btn" style="display:none; margin-left:1rem;">Cancel</button>
        </div>
      </form>
    </section>

    <section class="list-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3>Event List</h3>
        <button class="btn btn-secondary" id="refresh-btn">Refresh List</button>
      </div>
      <table class="crud-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Date</th>
            <th>Location</th>
            <th>Category</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="event-list">
          <!-- Data injected by JS -->
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const API_URL = 'api/events_api.php';
    const loader = document.getElementById('loader');
    const statusDiv = document.getElementById('status');
    const eventForm = document.getElementById('event-form');
    const eventList = document.getElementById('event-list');

    function showStatus(msg, type = 'success') {
      statusDiv.textContent = msg;
      statusDiv.className = `status-msg status-${type}`;
      statusDiv.style.display = 'block';
      setTimeout(() => statusDiv.style.display = 'none', 4000);
    }

    async function fetchEvents() {
      loader.style.display = 'flex';
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        if (result.success) {
          renderEvents(result.data);
        } else {
          showStatus(result.message, 'error');
        }
      } catch (err) {
        showStatus('Failed to fetch events: ' + err.message, 'error');
      } finally {
        loader.style.display = 'none';
      }
    }

    function renderEvents(events) {
      eventList.innerHTML = '';
      if (events.length === 0) {
        eventList.innerHTML = '<tr><td colspan="6" style="text-align:center;">No events found.</td></tr>';
        return;
      }
      events.forEach(e => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${e.event_id}</td>
          <td>${e.title}</td>
          <td>${e.event_date}</td>
          <td>${e.location}</td>
          <td>${e.category}</td>
          <td>
            <button class="btn-action btn-edit" onclick="editEvent(${e.event_id}, '${escape(e.title)}', '${e.event_date}', '${escape(e.location)}', '${e.category}')">Edit</button>
            <button class="btn-action btn-delete" onclick="deleteEvent(${e.event_id})">Delete</button>
          </td>
        `;
        eventList.appendChild(row);
      });
    }

    eventForm.onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('event-id').value;
      const action = id ? 'update' : 'add';

      const payload = {
        action: action,
        id: id ? parseInt(id) : null,
        title: document.getElementById('title').value,
        date: document.getElementById('date').value,
        location: document.getElementById('location').value,
        category: document.getElementById('category').value
      };

      loader.style.display = 'flex';
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();
        if (result.success) {
          showStatus(result.message);
          resetForm();
          fetchEvents();
        } else {
          showStatus(result.message, 'error');
        }
      } catch (err) {
        showStatus('Request failed: ' + err.message, 'error');
      } finally {
        loader.style.display = 'none';
      }
    };

    async function deleteEvent(id) {
      if (!confirm('Are you sure you want to delete this event?')) return;

      loader.style.display = 'flex';
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', id: id })
        });
        const result = await response.json();
        if (result.success) {
          showStatus(result.message);
          fetchEvents();
        } else {
          showStatus(result.message, 'error');
        }
      } catch (err) {
        showStatus('Delete failed: ' + err.message, 'error');
      } finally {
        loader.style.display = 'none';
      }
    }

    function editEvent(id, title, date, location, category) {
      document.getElementById('event-id').value = id;
      document.getElementById('title').value = unescape(title);
      document.getElementById('date').value = date;
      document.getElementById('location').value = unescape(location);
      document.getElementById('category').value = category;

      document.getElementById('form-title').textContent = 'Edit Event';
      document.getElementById('submit-btn').textContent = 'Update Event';
      document.getElementById('cancel-btn').style.display = 'inline-block';
    }

    function resetForm() {
      eventForm.reset();
      document.getElementById('event-id').value = '';
      document.getElementById('form-title').textContent = 'Add New Event';
      document.getElementById('submit-btn').textContent = 'Add Event';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    document.getElementById('cancel-btn').onclick = resetForm;
    document.getElementById('refresh-btn').onclick = fetchEvents;

    window.onload = fetchEvents;
  </script>
</body>
</html>
